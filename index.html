<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねむログ</title><meta name="theme-color" content="#2458ed"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>body{font-family:system-ui,sans-serif;background:#f4f7ff;color:#17233f;margin:0;padding:22px}main{max-width:560px;margin:auto}h1{font-size:28px}section{background:white;padding:20px;border-radius:20px;margin:14px 0;box-shadow:0 2px 12px #17233f0b}button{border:0;border-radius:14px;padding:17px 24px;background:#2458ed;color:white;font-weight:700;font-size:19px;width:100%;cursor:pointer}button.end{background:#ed8a30}button:disabled{opacity:.35;cursor:default}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{padding:22px 8px}button.small{width:auto;padding:8px 12px;font-size:13px;background:#e9edf6;color:#263656}#status{font-size:18px;margin:18px 0}#total{font-size:34px;font-weight:800}li{padding:10px 0;border-bottom:1px solid #edf0f5;display:flex;align-items:center;justify-content:space-between;gap:8px}small{color:#667085}.bar{height:16px;background:#e8ecf5;border-radius:8px;position:relative;overflow:hidden;margin:15px 0}.segment{position:absolute;top:0;bottom:0;background:#2458ed}input{font:inherit;max-width:100%} .muted{color:#65708a;font-size:13px}</style></head><body><main><h1>☾ ねむログ</h1><p class="muted">何回寝ても、ボタンひとつで記録。</p><section><div id="status"></div><div class="actions"><button id="sleep">☾ 寝る</button><button id="wake" class="end">☀ 起きた</button></div></section><section><div class="muted">今日の睡眠合計（0:00〜24:00）</div><div id="total">0時間0分</div><div id="timeline" class="bar"></div><small>左が0:00、右が24:00</small></section><section><h2>睡眠の履歴</h2><ul id="history" style="list-style:none;padding:0"></ul><button class="small" id="export">CSVを保存</button></section><section><h2>記録を追加・修正</h2><p class="muted">押し忘れたとき用</p><label>寝た時刻 <input type="datetime-local" id="start"></label><p><label>起きた時刻 <input type="datetime-local" id="end"></label></p><button class="small" id="add">記録を追加</button></section><p class="muted">データはこのブラウザー内に保存。ブラウザーのデータ削除で消えるため、時々CSV保存してください。</p></main><script>
const key='nemulog_v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{active:null,records:[]}}catch{data={active:null,records:[]}};
const $=id=>document.getElementById(id);const fmt=t=>new Date(t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});const dur=ms=>`${Math.floor(ms/3600000)}時間${Math.floor(ms%3600000/60000)}分`;const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('保存できません。ブラウザーの保存設定を確認してください。')}};
function render(){let now=Date.now(),active=data.active;$('status').textContent=active?'睡眠中 · '+fmt(active)+' から計測中':'起きている状態';$('sleep').disabled=!!active;$('wake').disabled=!active;let day=new Date();day.setHours(0,0,0,0);let a=+day,b=a+86400000;let records=[...data.records,...(active?[{start:active,end:now}]:[])];let total=0;let bar=$('timeline');bar.innerHTML='';for(let r of records){let s=Math.max(a,r.start),e=Math.min(b,r.end);if(e>s){total+=e-s;let el=document.createElement('span');el.className='segment';el.style.left=((s-a)/864000)+'%';el.style.width=((e-s)/864000)+'%';bar.append(el)}}$('total').textContent=dur(total);let list=$('history');list.innerHTML='';for(let r of [...data.records].sort((x,y)=>y.start-x.start).slice(0,100)){let li=document.createElement('li');let span=document.createElement('span');span.textContent=fmt(r.start)+' 〜 '+fmt(r.end)+'（'+dur(r.end-r.start)+'）';let btn=document.createElement('button');btn.className='small';btn.textContent='削除';btn.onclick=()=>{if(confirm('この記録を削除しますか？')){data.records=data.records.filter(x=>x.id!==r.id);save();render()}};li.append(span,btn);list.append(li)}if(!data.records.length)list.textContent='まだ記録はありません。'}
$('sleep').onclick=()=>{if(data.active)return;data.active=Date.now();save();render()};$('wake').onclick=()=>{if(!data.active)return;let now=Date.now();if(now>data.active)data.records.push({id:String(now)+'-'+Math.random(),start:data.active,end:now});data.active=null;save();render()};$('add').onclick=()=>{let s=new Date($('start').value).getTime(),e=new Date($('end').value).getTime();if(!Number.isFinite(s)||!Number.isFinite(e)||e<=s){alert('正しい開始・終了時刻を入力してください');return}data.records.push({id:String(Date.now())+'-'+Math.random(),start:s,end:e});save();render()};$('export').onclick=()=>{let rows=['start,end,minutes',...data.records.map(r=>`${new Date(r.start).toISOString()},${new Date(r.end).toISOString()},${((r.end-r.start)/60000).toFixed(1)}`)];let url=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='nemulog.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();setInterval(render,30000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
